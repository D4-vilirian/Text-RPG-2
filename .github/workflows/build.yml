name: Gerar APK TextRPG 2
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          pip3 install --upgrade buildozer cython==0.29.33 virtualenv
      - name: Compilar APK
        run: yes | buildozer android debug
      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: TextRPG2-APK
          path: bin/*.apk
          
